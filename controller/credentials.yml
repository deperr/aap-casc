---

controller_credentials:

- name: AWS (Personal)
  organization: Default
  credential_type: Amazon Web Services
  inputs:
    username: REPLACEME
    password: REPLACEME

- name: AWS (Open Environment)
  organization: Default
  credential_type: Amazon Web Services
  inputs:
    username: REPLACEME
    password: REPLACEME

- name: Linux
  organization: Default
  credential_type: Machine
  inputs:
    username: REPLACEME
    password: REPLACEME
    become_method: sudo
    become_password: REPLACEME

- name: Windows
  organization: Default
  credential_type: Machine
  inputs:
    username: REPLACEME
    password: REPLACEME

- name: ServiceNow (Dev)
  organization: Default
  credential_type: ServiceNow Credential
  inputs:
    snow_host: REPLACEME
    snow_user: REPLACEME
    snow_password: REPLACEME
    snow_client_id: REPLACEME
    snow_client_secret: REPLACEME

- name: Insights (svc key)
  organization: Default
  credential_type: Insights
  inputs:
    username: REPLACEME
    password: REPLACEME

- name: Insights
  organization: Default
  credential_type: Insights
  inputs:
    username: REPLACEME
    password: REPLACEME

