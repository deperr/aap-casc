---

controller_workflows:

  #############################
  # Linux Workflows
  #############################

  - name: Linux | Workflow | Patch and STIG
    organization: Default
    description: "NOTE: This is managed by Config as Code. Manual changes may be overwritten."
    allow_simultaneous: true
    labels: ['linux', 'security']
    survey_enabled: true
    survey_spec:
      name: ''
      description: ''
      spec:
        - question_name: Server Name or Pattern
          type: text
          variable: _hosts
          required: true
          default: web01.dperrone.dev
    simplified_workflow_nodes:

      - identifier: Sync Project
        all_parents_must_converge: false
        unified_job_template: "Personal | AAP Demos"
        success_nodes: 
          - Approve Workflow

      - identifier: Sync Inventory
        all_parents_must_converge: false
        unified_job_template: "Red Hat Insights"
        success_nodes: 
          - Approve Workflow

      - identifier: Approve Workflow
        all_parents_must_converge: true
        approval_node:
          name: Simple approval node name
          description: Approve this to proceed in workflow
          timeout: 900
        success_nodes:
          - Patch Linux Hosts
        
      - identifier: Patch Linux Hosts
        unified_job_template: "Linux | Patch Hosts"
        success_nodes:
          - STIG Hosts

      - identifier: STIG Hosts
        unified_job_template: "Linux | DISA STIG"

  #############################
  # ServiceNow Workflows
  #############################

  - name: ServiceNow | Workflow | Incident Lifecycle
    organization: Default
    description: "NOTE: This is managed by Config as Code. Manual changes may be overwritten."
    allow_simultaneous: true
    labels: ['itsm']
    survey_enabled: true
    survey_spec:
      name: ''
      description: ''
      spec:
        - question_name: Enter Short Description
          variable: incident_short_description
          required: true
          type: text
          default: Incident created via AAP workflow.
        - question_name: Describe the Incident
          variable: incident_description
          required: true
          type: textarea
          default: This is an incident created using AAP with the servicenow.itsm collection.
        - question_name: Incident Urgency
          variable: incident_urgency
          required: true
          type: multiplechoice
          choices:
            - high
            - medium
            - low
          default: medium
        - question_name: Incident Impact
          variable: incident_impact
          required: true
          type: multiplechoice
          choices:
            - high
            - medium
            - low
          default: medium
        - question_name: Incident State
          variable: incident_state
          required: true
          type: multiplechoice
          choices:
            - new
            - in_progress
            - on_hold
            - resolved
            - closed
            - cancelled
            - absent
          default: new
    simplified_workflow_nodes:
      - identifier: Create Ticket
        unified_job_template: "ServiceNow | Create Incident Ticket"
        success_nodes:
          - Update Ticket

      - identifier: Update Ticket
        unified_job_template: "ServiceNow | Update Incident Ticket"
        success_nodes:
          - Close Ticket

      - identifier: Close Ticket
        unified_job_template: "ServiceNow | Close Incident Ticket"

  - name: "ServiceNow | Workflow | Provision and Patch EC2"
    description: >-
      Opens a ServiceNow incident, provisions an EC2 instance, patches it, and resolves
      the ticket. Failures leave the ticket open and escalated instead.
    organization: Default
    labels: ['itsm', 'casc']
    ask_variables_on_launch: true
    survey_enabled: true
    survey:
      name: ''
      description: ''
      spec:
        - question_name: Name
          question_description: Desired hostname of server.
          type: text
          variable: create_vm_vm_name
          required: true

        - question_name: Blueprint
          question_description: "RHEL family only. Patches with DNF."
          type: multiplechoice
          variable: vm_blueprint
          required: true
          default: rhel9
          choices:
            - rhel9
            - rhel8
            - al2023

        - question_name: Select AWS Region
          type: multiplechoice
          variable: create_vm_aws_region
          required: true
          default: us-east-2
          choices:
            - us-east-1
            - us-east-2
            - us-west-1
            - us-west-2

        - question_name: Environment
          type: multiplechoice
          variable: create_vm_vm_environment
          required: true
          default: Dev
          choices:
            - Dev
            - QA
            - Prod

        - question_name: Owner
          type: text
          variable: create_vm_vm_owner
          required: true
          default: ansible

        - question_name: Deployment
          type: text
          variable: create_vm_vm_deployment
          required: true
          default: default

        - question_name: Purpose
          type: text
          variable: create_vm_vm_purpose
          required: true
          default: demo

        - question_name: Subnet
          question_description: Name tag of the subnet, not its id.
          type: text
          variable: create_vm_aws_vpc_subnet_name
          required: true
          default: aws-test-subnet

        - question_name: Security Group
          question_description: Name of the security group, not its id.
          type: text
          variable: create_vm_aws_securitygroup_name
          required: true
          default: aws-test-sg

        - question_name: SSH Keypair
          type: text
          variable: create_vm_aws_keypair_name
          required: true
          default: aws-test-key

        - question_name: AWS Instance Type (blank uses the default)
          type: text
          variable: create_vm_aws_instance_size
          required: false
          default: ''

        - question_name: AWS Image Filter (blank uses the default)
          type: text
          variable: create_vm_aws_image_filter
          required: false
          default: ''

        - question_name: Pin an AMI (blank discovers the newest)
          question_description: >-
            Set this to skip AMI discovery entirely.
          type: text
          variable: create_vm_aws_instance_ami
          required: false
          default: ''

    simplified_workflow_nodes:
      - identifier: Open Ticket
        unified_job_template: "ServiceNow | Provision and Patch | Open Ticket"
        success_nodes:
          - Provision EC2

      - identifier: Provision EC2
        unified_job_template: "ServiceNow | Provision and Patch | Provision EC2 Instance"
        success_nodes:
          - Patch Instance
        failure_nodes:
          - Escalate

      - identifier: Patch Instance
        unified_job_template: "ServiceNow | Provision and Patch | Patch EC2 Instance"
        success_nodes:
          - Reboot and Verify
        failure_nodes:
          - Escalate

      - identifier: Reboot and Verify
        unified_job_template: "ServiceNow | Provision and Patch | Reboot and Verify"
        success_nodes:
          - Close Ticket
        failure_nodes:
          - Escalate

      - identifier: Close Ticket
        unified_job_template: "ServiceNow | Provision and Patch | Close Ticket"
        success_nodes:
          - Approve Teardown
        failure_nodes:
          - Escalate

      - identifier: Approve Teardown
        approval_node:
          name: ServiceNow | Provision and Patch | Approve Teardown
          description: Approve to tear down the provisioned EC2 instance.
          timeout: 900
        success_nodes:
          - Teardown

      - identifier: Teardown
        unified_job_template: "ServiceNow | Provision and Patch | Teardown"
        failure_nodes:
          - Escalate

      - identifier: Escalate
        unified_job_template: "ServiceNow | Provision and Patch | Escalate Ticket"

