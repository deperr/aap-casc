---

gateway_authenticators:

  - name: Microsoft Active Directory
    type: ansible_base.authentication.authenticator_plugins.ldap
    slug: ansible_base-authentication-authenticator_plugins-ldap__microsoft-active-directory
    order: 1
    enabled: true
    create_objects: true
    remove_users: true
    configuration:
      BIND_DN: CN=Administrator,CN=Users,DC=dperrone,DC=dev
      BIND_PASSWORD: REPLACEME
      CONNECTION_OPTIONS: {}
      GROUP_SEARCH:
        - ou=ansible_ou,dc=dperrone,dc=dev
        - SCOPE_SUBTREE
        - "(objectClass=group)"
      GROUP_TYPE: ActiveDirectoryGroupType
      GROUP_TYPE_PARAMS:
        name_attr: cn
      SERVER_URI:
        - ldap://dc01.dperrone.dev:389
      START_TLS: false
      USER_ATTR_MAP:
        email: mail
        last_name: sn
        first_name: givenName
      USER_SEARCH:
        - ou=ansible_ou,dc=dperrone,dc=dev
        - SCOPE_SUBTREE
        - "(sAMAccountName=%(user)s)"